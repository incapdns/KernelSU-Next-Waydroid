name: Build Waydroid Manager

on:
  workflow_dispatch:

jobs:
  build-ksud:
    strategy:
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android]
    uses: ./.github/workflows/ksud.yml
    with:
      target: ${{ matrix.target }}
      os: ubuntu-latest
      pack_lkm: false
      pack_ksuinit: false

  build-manager:
    needs: build-ksud
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download arm64 ksud
        uses: actions/download-artifact@v7
        with:
          name: ksud-aarch64-linux-android
          path: aarch64

      - name: Download x86_64 ksud
        uses: actions/download-artifact@v7
        with:
          name: ksud-x86_64-linux-android
          path: x86_64

      - name: Install matching ksud binaries
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          cp aarch64/aarch64-linux-android/release/ksud app/src/main/jniLibs/arm64-v8a/libksud.so
          cp x86_64/x86_64-linux-android/release/ksud app/src/main/jniLibs/x86_64/libksud.so

      - name: Build Manager
        run: ./gradlew clean assembleRelease

      - name: Upload Manager APK
        uses: actions/upload-artifact@v7
        with:
          name: waydroid-manager
          path: manager/app/build/outputs/apk/release/*.apk
